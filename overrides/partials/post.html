{% if page.url != post.url %}
<!-- ASTRO PAPER INDEX LAYOUT -->
<article class="astro-post">
  <!-- 1. Clickable Title -->
  <h2 class="astro-title">
    <a href="{{ post.url | url }}">{{ post.title }}</a>
  </h2>

  <!-- 2. Date -->
  {% if post.config.date %}
  <div class="astro-date">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
      <line x1="16" y1="2" x2="16" y2="6"></line>
      <line x1="8" y1="2" x2="8" y2="6"></line>
      <line x1="3" y1="10" x2="21" y2="10"></line>
    </svg>
    <time>{{ post.config.date.created | date }}</time>
  </div>
  {% endif %}

  <!-- 3. Excerpt -->
  <div class="astro-excerpt">{{ post.content }}</div>
</article>

{% else %}
<!-- SINGLE POST VIEW (LEAVE UNTOUCHED) -->
<article class="md-post">
  <header class="md-post__header">
    <h1 class="md-post__title">{{ post.title }}</h1>
    {% if post.config.date %}
    <div class="md-post__meta md-meta">
      {{ post.config.date.created | date }}
    </div>
    {% endif %}
  </header>
  <div class="md-post__content md-typeset">{{ post.content }}</div>
</article>
{% endif %}
