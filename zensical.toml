      ]},
      { "6. Capstone Projects" = [
        { "Project 1" = "foundations/linux/20-project1.md" },
        { "Project 2" = "foundations/linux/21-project2.md" },
        { "Project 3" = "foundations/linux/22-project3.md" },
      ]},
    ]},

    
  ]},

  # 2. PROJECTS TAB
  { "Projects" = [
  { "Overview" = "projects/overview.md" },  

    { "Linux" = [
      { "Secure a Linux Server" = [
            { "Setup the server" = "projects/linux/secure-a-linux-server.md" },
      ]}
    ]},

  ]},

