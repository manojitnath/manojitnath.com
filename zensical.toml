        { "Listing Files" = "foundations/linux/01-basics-and-filesystem/03-listing-files.md"" },
      ]},

      { "2. Text & Permissions" = [
        { "06 - Searching Text" = "foundations/linux/06.md" },
        { "07 - Editing Files" = "foundations/linux/07.md" },
        { "08 - Users & Permissions" = "foundations/linux/08.md" },
      ]},
      { "3. Processes & Services" = [
        { "09 - Processes" = "foundations/linux/09.md" },
        { "10 - systemd Services" = "foundations/linux/10.md" },
        { "11 - Networking Essentials" = "foundations/linux/11.md" },
      ]},
      { "4. System Administration" = [
        { "12 - Package Management" = "foundations/linux/12.md" },
        { "13 - Disks & Filesystems" = "foundations/linux/13.md" },
        { "14 - Monitoring & Perf" = "foundations/linux/14.md" },
        { "15 - Scheduled Jobs" = "foundations/linux/15.md" },
      ]},
      { "5. Advanced Tools" = [
